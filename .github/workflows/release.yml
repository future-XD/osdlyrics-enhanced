name: Build & Release Enhanced OSD Lyrics

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  debian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autotools-dev automake libtool intltool pkg-config \
              devscripts debhelper fakeroot libgtk2.0-dev python3 python3-gi python3-dbus libsqlite3-dev \
              libcurl4-openssl-dev libnotify-dev

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)

      - name: Package .deb
        run: |
          mkdir -p pkg-deb
          make DESTDIR="$PWD/pkg-deb" install
          cd pkg-deb
          # Basic deb package creation; for production, consider using debhelper or build-deb-action[1]
          fpm -s dir -t deb -n osdlyrics-enhanced -v "${GITHUB_REF_NAME#v}" -C . \
            --prefix=/ --deb-no-default-config-files=1 --description "OSD Lyrics Enhanced LRC" .
        env:
          FPM_VERSION: 1.10.2

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: osdlyrics-enhanced-deb
          path: pkg-deb/*.deb

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git gtk2 python python-gobject python-dbus sqlite curl libnotify intltool pkgconf autoconf automake libtool

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)

      - name: Package (PKG)
        run: |
          mkdir -p pkg-arch
          make DESTDIR="$PWD/pkg-arch" install
          BS_VERSION="${GITHUB_REF_NAME#v}"
          tar -C pkg-arch -czf osdlyrics-enhanced-arch.tar.gz .

      - name: Upload .tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: osdlyrics-enhanced-arch
          path: osdlyrics-enhanced-arch.tar.gz

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf -y upgrade
          dnf -y install make automake gcc gcc-c++ kernel-devel intltool pkgconfig gtk2-devel \
            python3 python3-gobject python3-dbus sqlite-devel libcurl-devel libnotify-devel

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)

      - name: Package (RPM)
        run: |
          mkdir -p pkg-fedora
          make DESTDIR="$PWD/pkg-fedora" install
          # For production, create a proper SPEC file and use rpmbuild or fpm
          tar -C pkg-fedora -czf osdlyrics-enhanced-fedora.tar.gz .

      - name: Upload .tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: osdlyrics-enhanced-fedora
          path: osdlyrics-enhanced-fedora.tar.gz

  appimage:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autotools-dev automake libtool intltool pkg-config \
            libgtk2.0-dev python3 python3-gi python3-dbus libsqlite3-dev libcurl4-openssl-dev \
            libnotify-dev wget

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)

      - name: Create AppDir and install
        run: |
          mkdir -p AppDir/usr
          make DESTDIR=$PWD/AppDir install
          cp data/osdlyrics-enhanced.desktop AppDir/
          # Copy icon, fallback if missing
          find ./data/icons -name osdlyrics-enhanced.png | head -n1 | xargs -I@ cp @ AppDir/.

      - name: Download AppImage tool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage AppDir osdlyrics-enhanced-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: osdlyrics-enhanced-appimage
          path: osdlyrics-enhanced-x86_64.AppImage

